<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda - Caroline & Félix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <h1>Caroline & Félix</h1>
    </div>
  </header>

  <section class="story-quote">
    <p>"Una frase corta y profunda que resuma su historia de amor."</p>
  </section>

  <section class="gallery">
    <h2>Nuestra Historia</h2>
    <div class="timeline-grid">
      <div class="photo-card">
        <img src="assets/foto1.jpg" alt="Momento 1">
        <span>El inicio</span>
      </div>
      <div class="photo-card">
        <img src="assets/foto2.jpg" alt="Momento 2">
        <span>Primer viaje</span>
      </div>
      <div class="photo-card">
        <img src="assets/foto3.jpg" alt="Momento 3">
        <span>Un nuevo paso</span>
      </div>
    </div>
  </section>

  <section class="video-section">
    <h2>La Propuesta</h2>
    <div class="video-container">
      <video controls poster="assets/portada-video.jpg">
        <source src="assets/propuesta.mp4" type="video/mp4">
        Tu navegador no soporta el formato de video.
      </video>
    </div>
  </section>

  <section class="save-the-date">
    <p class="subtitle">Nos casamos</p>
    <p class="date">24 · 10 · 2026</p>
  </section>

  <footer class="closing-section">
    <div class="closing-content">
      <p>"Frase final de cierre para agradecer o invitar a acompañarlos."</p>
    </div>
  </footer>

</body>
</html>
